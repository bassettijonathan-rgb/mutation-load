name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model:
    name: Unit tests and long runs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Long runs (kernels identical, scenarios end as the page says)
        run: npm run test:long

  page:
    name: Build, validation and browser check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the page (runs every validation check, about 5 minutes)
        run: npm run build
      - name: The committed page and results match a fresh build
        run: git diff --exit-code -- dist/
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (desktop and phone)
        run: npm run test:browser
